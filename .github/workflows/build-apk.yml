name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.suppressUnsupportedVersionErrors=true" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.project.kotlin.suppressUnsupportedVersionErrors=true" >> ~/.gradle/gradle.properties
          echo "kotlin.suppressUnsupportedVersionErrors=true" >> android/gradle.properties
          if [ -d "node_modules/expo-modules-autolinking/android/expo-gradle-plugin" ]; then
            echo "kotlin.suppressUnsupportedVersionErrors=true" >> node_modules/expo-modules-autolinking/android/expo-gradle-plugin/gradle.properties
          fi
          cd android
          ./gradlew assembleDebug -Dorg.gradle.project.kotlin.suppressUnsupportedVersionErrors=true -Pkotlin.suppressUnsupportedVersionErrors=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: granth-prabandhan-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
