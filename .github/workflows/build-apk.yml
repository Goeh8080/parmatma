name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/kotlin-fix.gradle
          allprojects {
              tasks.configureEach { task ->
                  if (task.name.toLowerCase().contains("kotlin")) {
                      try {
                          task.kotlinOptions.freeCompilerArgs = (task.kotlinOptions.freeCompilerArgs ?: []) + [
                              "-Xskip-metadata-version-check",
                              "-Xskip-prerelease-check",
                              "-Xallow-unstable-dependencies"
                          ]
                      } catch (Throwable t) {}
                      try {
                          task.compilerOptions.freeCompilerArgs.addAll([
                              "-Xskip-metadata-version-check",
                              "-Xskip-prerelease-check",
                              "-Xallow-unstable-dependencies"
                          ])
                      } catch (Throwable t) {}
                  }
              }
          }
          EOF
          echo "kotlin.suppressUnsupportedVersionErrors=true" >> android/gradle.properties
          cd android
          ./gradlew assembleDebug --init-script ~/.gradle/init.d/kotlin-fix.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: granth-prabandhan-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
